name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy infrastructure to'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - deploy
          - remove
        default: 'deploy'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy Infrastructure
        if: inputs.action == 'deploy'
        run: npx serverless deploy --config serverless-infrastructure.yml --stage ${{ inputs.environment }}

      - name: Remove Infrastructure
        if: inputs.action == 'remove'
        run: npx serverless remove --config serverless-infrastructure.yml --stage ${{ inputs.environment }}

      - name: Output Results
        if: inputs.action == 'deploy'
        run: |
          echo "Infrastructure deployed successfully!"
          echo "User Pool and Client IDs are exported for use by application stack"