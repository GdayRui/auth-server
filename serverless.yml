service: cognito-auth-server

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'ap-southeast-2'}
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: gdayrui-deployments-bucket
  environment:
    USER_POOL_ID:
      Fn::ImportValue: ${self:custom.userPoolStackName}-user-pool-id
    USER_POOL_CLIENT_ID:
      Fn::ImportValue: ${self:custom.userPoolStackName}-user-pool-client-id
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminRespondToAuthChallenge
        - cognito-idp:ListUsers
      Resource: 
        - arn:aws:cognito-idp:${self:provider.region}:*:userpool/*

plugins:
  - serverless-offline

package:
  individually: false
  patterns:
    - '!**'
    - 'dist/**'
    - 'node_modules/**'

custom:
  userPoolStackName: cognito-auth-infrastructure-${self:provider.stage}

functions:
  # Authentication endpoints
  login:
    handler: dist/handlers/auth.login
    events:
      - http:
          path: /auth/login
          method: post
          cors: true

  register:
    handler: dist/handlers/auth.register
    events:
      - http:
          path: /auth/register
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

  refreshToken:
    handler: dist/handlers/auth.refreshToken
    events:
      - http:
          path: /auth/refresh
          method: post
          cors: true

  logout:
    handler: dist/handlers/auth.logout
    events:
      - http:
          path: /auth/logout
          method: post
          cors: true

  # Token validation
  validateToken:
    handler: dist/handlers/token.validate
    events:
      - http:
          path: /token/validate
          method: post
          cors: true

  # User management
  getUser:
    handler: dist/handlers/user.getUser
    events:
      - http:
          path: /user/profile
          method: get
          cors: true

  updateUser:
    handler: dist/handlers/user.updateUser
    events:
      - http:
          path: /user/profile
          method: put
          cors: true

  deleteUser:
    handler: dist/handlers/user.deleteUser
    events:
      - http:
          path: /user/profile
          method: delete
          cors: true

  changePassword:
    handler: dist/handlers/user.changePassword
    events:
      - http:
          path: /user/change-password
          method: post
          cors: true

resources:
  Outputs:
    ApiGatewayRestApiId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${self:service}-${self:provider.stage}-api-gateway-id