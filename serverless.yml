service: cognito-auth-server

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'ap-southeast-2'}
  stage: ${opt:stage, 'dev'}
  deploymentBucket:
    name: gdayrui-deployments-bucket
  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - cognito-idp:AdminCreateUser
        - cognito-idp:AdminDeleteUser
        - cognito-idp:AdminGetUser
        - cognito-idp:AdminUpdateUserAttributes
        - cognito-idp:AdminSetUserPassword
        - cognito-idp:AdminInitiateAuth
        - cognito-idp:AdminRespondToAuthChallenge
        - cognito-idp:ListUsers
      Resource: 
        - arn:aws:cognito-idp:${self:provider.region}:*:userpool/*
    - Effect: Allow
      Action:
        - ssm:GetParameter
        - ssm:GetParameters
      Resource:
        - arn:aws:ssm:${self:provider.region}:*:parameter/auth-server/apps/*

plugins:
  - serverless-offline

package:
  individually: false
  patterns:
    - '!**'
    - 'dist/**'
    - 'node_modules/**'

custom:
  corsConfig:
    origin: '*'
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
      - X-App-ID
    allowCredentials: false

functions:
  # Authentication endpoints
  login:
    handler: dist/handlers/auth.login
    events:
      - http:
          path: /auth/login
          method: post
          cors: ${self:custom.corsConfig}

  register:
    handler: dist/handlers/auth.register
    events:
      - http:
          path: /auth/register
          method: post
          cors: ${self:custom.corsConfig}

  refreshToken:
    handler: dist/handlers/auth.refreshToken
    events:
      - http:
          path: /auth/refresh
          method: post
          cors: ${self:custom.corsConfig}

  logout:
    handler: dist/handlers/auth.logout
    events:
      - http:
          path: /auth/logout
          method: post
          cors: ${self:custom.corsConfig}

  # Token validation
  validateToken:
    handler: dist/handlers/token.validate
    events:
      - http:
          path: /token/validate
          method: post
          cors: ${self:custom.corsConfig}

  # User management
  getUser:
    handler: dist/handlers/user.getUser
    events:
      - http:
          path: /user/profile
          method: get
          cors: ${self:custom.corsConfig}

  updateUser:
    handler: dist/handlers/user.updateUser
    events:
      - http:
          path: /user/profile
          method: put
          cors: ${self:custom.corsConfig}

  deleteUser:
    handler: dist/handlers/user.deleteUser
    events:
      - http:
          path: /user/profile
          method: delete
          cors: ${self:custom.corsConfig}

  changePassword:
    handler: dist/handlers/user.changePassword
    events:
      - http:
          path: /user/change-password
          method: post
          cors: ${self:custom.corsConfig}

resources:
  Outputs:
    ApiGatewayRestApiId:
      Value:
        Ref: ApiGatewayRestApi
      Export:
        Name: ${self:service}-${self:provider.stage}-api-gateway-id